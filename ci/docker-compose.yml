name: eventpro-ci

services:
  jenkins:
    image: eventpro-jenkins:lts
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_HTTP_PORT:-8081}:8080"
    environment:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
    secrets:
      - JENKINS_ADMIN_PASSWORD
    group_add:
      - "${DOCKER_GID:-986}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${JAVA_HOME:-${HOME}/.jdks/temurin-25.0.5}
        target: /opt/jdk-25
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./jenkins/casc.yaml
        target: /usr/share/jenkins/ref/casc.yaml
        read_only: true

networks:
  default:
    name: eventpro-ci

volumes:
  jenkins_home:

secrets:
  JENKINS_ADMIN_PASSWORD:
    file: ../secrets/jenkins.password.txt